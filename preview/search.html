<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111315"><meta name="robots" content="noindex,nofollow"><title>Recherche — Breslev Gang · Prévisualisation</title><meta name="description" content="Recherche dans les 586 fiches Breslev Gang : noms, familles, couleurs."><script>document.documentElement.classList.add("js")</script><script src="../theme/assets/bg-theme.js"></script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@400;500;600&display=swap" media="print" onload="this.media='all'"><link rel="preconnect" href="https://cdn.shopify.com"><link rel="stylesheet" href="../theme/assets/bg-tokens.css"><link rel="stylesheet" href="../theme/assets/bg-base.css"><link rel="icon" href="https://breslevgang.com/cdn/shop/files/2.jpg?crop=center&height=32&v=1691346121&width=32"></head><body><script src="data.js"></script><script src="../theme/assets/bg-cart.js"></script><script src="bg-preview.js"></script><script>BG.preview.header('Recherche');</script>
<main>
  <div class="bg-wrap bg-coll-head"><p class="bg-kicker">Recherche · tout le catalogue</p><h1 class="bg-display">Rechercher</h1>
    <form class="bg-search" role="search" id="sform"><label class="bg-sr" for="sq">Rechercher une pièce</label><input id="sq" name="q" type="search" placeholder="Maguen, Hay, Petek croco, kippa…" autocomplete="off" enterkeyhint="search"><button class="bg-btn" type="submit"><span>Chercher</span></button></form></div>
  <div class="bg-wrap">
    <div class="bg-bar"><div class="bg-filters" id="filters" role="group" aria-label="Familles"></div></div>
    <p class="bg-dim" id="count" aria-live="polite" style="margin-bottom:18px"></p>
    <div class="bg-grid" id="grid"></div>
    <p class="bg-empty" id="empty" hidden>Aucune pièce ne correspond. Essayez un autre mot (Hay, Haï, Flamme, Petek, kippa…).</p>
    <div style="display:flex;justify-content:center;padding:48px 0 90px"><button class="bg-btn bg-btn--ghost" type="button" id="more" hidden>Afficher plus</button></div>
  </div></main>
<script src="../theme/assets/bg-product.js"></script><script src="../theme/assets/bg-ui.js"></script>
<script>
(function () {
  var D = window.BG_DATA, P = BG.preview, U = new URLSearchParams(location.search);
  P.footer();
  var st = { q: U.get('q') || '', k: U.get('k') || '', n: 24 }, input = document.getElementById('sq');
  input.value = st.q;
  function draw() {
    var all = D.products.filter(function (p) { return BG.matches(p, st.q); });
    var by = {}; all.forEach(function (p) { by[p.k] = (by[p.k] || 0) + 1; });
    var f = document.getElementById('filters'); f.innerHTML = '';
    Object.keys(BG.kinds).forEach(function (k) {
      if (!by[k]) return;
      var b = document.createElement('button'); b.type = 'button'; b.className = 'bg-chip'; b.textContent = BG.kinds[k] + ' · ' + by[k]; b.setAttribute('aria-pressed', st.k === k);
      b.onclick = function () { st.k = st.k === k ? '' : k; st.n = 24; draw(); }; f.appendChild(b);
    });
    var l = all.filter(function (p) { return !st.k || p.k === st.k; });
    document.getElementById('grid').innerHTML = l.slice(0, st.n).map(function (p, i) { return P.card(p, { eager: i < 4 }); }).join('');
    document.getElementById('count').textContent = (st.q ? l.length + (l.length > 1 ? ' pièces' : ' pièce') + ' pour « ' + st.q + ' »' : l.length + ' pièces — tout le catalogue');
    document.getElementById('empty').hidden = l.length > 0;
    document.getElementById('more').hidden = l.length <= st.n;
  }
  document.getElementById('sform').addEventListener('submit', function (e) { e.preventDefault(); st.q = input.value; st.n = 24; draw(); });
  input.addEventListener('input', function () { st.q = input.value; st.n = 24; draw(); });
  document.getElementById('more').onclick = function () { st.n += 24; draw(); };
  draw();
})();
</script></body></html>
