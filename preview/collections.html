<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111315"><meta name="robots" content="noindex,nofollow"><title>Collections — Breslev Gang · Prévisualisation</title><meta name="description" content="Toutes les familles du catalogue Breslev Gang : colliers, Peteks, bijoux, vêtements et plus."><script>document.documentElement.classList.add("js")</script><script src="../theme/assets/bg-theme.js"></script><link rel="preconnect" href="https://cdn.shopify.com"><link rel="stylesheet" href="../theme/assets/bg-tokens.css"><link rel="stylesheet" href="../theme/assets/bg-base.css"><link rel="icon" href="https://breslevgang.com/cdn/shop/files/2.jpg?crop=center&height=32&v=1691346121&width=32"></head><body><script src="data.js"></script><script src="media-map.js"></script><script src="../theme/assets/bg-cart.js"></script><script src="bg-preview.js"></script><script>BG.preview.header('Collections');</script>
<main>
  <div class="bg-wrap bg-coll-head"><p class="bg-kicker">Collections · relevé public 29/10/2026</p><h1 class="bg-display">Collections</h1><p class="bg-dim" style="margin-top:18px;max-width:52ch">Les 586 fiches publiques, rangées par famille. Chaque pièce n’apparaît qu’une fois ici ; les anciennes collections de la boutique se chevauchent.</p></div>
  <div class="bg-wrap"><div class="bg-index" id="index"></div></div></main>
<script src="../theme/assets/bg-product.js"></script><script src="../theme/assets/bg-ui.js"></script>
<script>
(function () {
  var D = window.BG_DATA, P = BG.preview; P.footer();
  var groups = {}, order = ['Collier', 'Petek', 'Bijou', 'Vetement', 'Autre'];
  D.products.forEach(function (p) { var g = groups[p.k] = groups[p.k] || { n: 0, f: {} }; g.n++; g.f[p.f] = (g.f[p.f] || 0) + 1; });
  var html = '<a href="collection.html?k=Tout"><b>Tous les produits</b><span>' + D.products.length + ' fiches</span></a>';
  order.forEach(function (k) {
    var g = groups[k]; if (!g) return;
    html += '<h2>' + BG.esc(BG.kinds[k]) + ' · ' + g.n + '</h2><a href="collection.html?k=' + k + '"><b>Tous les ' + BG.esc(BG.kinds[k].toLowerCase()) + '</b><span>' + g.n + ' fiches</span></a>';
    Object.keys(g.f).sort(function (a, b) { return g.f[b] - g.f[a]; }).forEach(function (f) {
      html += '<a href="collection.html?k=' + k + '&f=' + encodeURIComponent(f) + '"><b>' + BG.esc(f) + '</b><span>' + g.f[f] + (g.f[f] > 1 ? ' fiches' : ' fiche') + '</span></a>';
    });
  });
  document.getElementById('index').innerHTML = html;
})();
</script></body></html>
