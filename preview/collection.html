<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111315"><meta name="robots" content="noindex,nofollow"><title>Collection — Breslev Gang · Prévisualisation</title><meta name="description" content="Colliers et Peteks Breslev Gang : filtres par famille, prix et disponibilité. Prévisualisation BRUNFRAME."><script>document.documentElement.classList.add("js")</script><script src="../theme/assets/bg-theme.js"></script><link rel="preconnect" href="https://cdn.shopify.com"><link rel="stylesheet" href="../theme/assets/bg-tokens.css"><link rel="stylesheet" href="../theme/assets/bg-base.css"><link rel="icon" href="https://breslevgang.com/cdn/shop/files/2.jpg?crop=center&height=32&v=1691346121&width=32"></head><body><script src="data.js"></script><script src="media-map.js"></script><script src="../theme/assets/bg-cart.js"></script><script src="bg-preview.js"></script><script>BG.preview.header({ Collier: 'Colliers', Petek: 'Peteks', Bijou: 'Bijoux', Vetement: 'Vêtements', Autre: 'Plus', Tout: 'Collections' }[new URLSearchParams(location.search).get('k')] || 'Colliers');</script>
<main>
  <div class="bg-wrap bg-coll-head"><p class="bg-kicker" id="ckick">Collection</p><h1 class="bg-display" id="ctitle">Colliers</h1><p class="bg-dim" id="cintro" style="margin-top:18px;max-width:52ch"></p></div>
  <div class="bg-wrap">
    <div class="bg-bar"><div class="bg-filters" id="filters" role="group" aria-label="Filtres"></div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <label class="bg-toggle"><input type="checkbox" id="grp" checked> 1 modèle = 1 fiche <span class="bg-demo-tag">proposition</span></label>
        <label class="bg-sr" for="sort">Trier</label>
        <select class="bg-select" id="sort"><option value="">Nouveautés</option><option value="pa">Prix croissant</option><option value="pd">Prix décroissant</option><option value="az">A → Z</option></select></div></div>
    <p class="bg-dim" id="count" aria-live="polite" style="margin-bottom:18px"></p>
    <div class="bg-grid" id="grid"></div>
    <p class="bg-empty" id="empty" hidden>Aucune pièce ne correspond. <button class="bg-link" type="button" id="reset">Réinitialiser</button></p>
    <div style="display:flex;justify-content:center;padding:48px 0 90px"><button class="bg-btn bg-btn--ghost" type="button" id="more" hidden>Afficher plus</button></div>
  </div>
</main>
<script src="../theme/assets/bg-product.js"></script><script src="../theme/assets/bg-ui.js"></script>
<script>
(function () {
  var D = window.BG_DATA, P = BG.preview, U = new URLSearchParams(location.search);
  var st = { k: U.get('k') || 'Collier', f: U.get('f') || '', q: U.get('q') || '', price: '', avail: false, sort: '', grp: true, n: 24 };
  P.footer();
  var INTRO = { Collier: 'Flamme, Maguen David, Hay, Mezouza, Israël, Tsadikim : tous les symboles publiés sur la boutique, par thème dominant.',
    Petek: 'À perles, à chaîne, cordon, Kids : tous les montages publiés. Couleurs et textures se retrouvent dans la recherche.',
    Bijou: 'Bracelets, broches Petek bébé, boucles d’oreilles.', Vetement: 'Sweats à capuche, pulls, T-shirts et jogging, en Couleur × Taille.',
    Autre: 'Maison & objets, kippot, coffrets, maroquinerie et carte cadeau.', Tout: 'Tout le catalogue public : 586 fiches.' };
  if (!BG.kinds[st.k] && st.k !== 'Tout') st.k = 'Collier';
  var title = st.k === 'Tout' ? 'Tous les produits' : BG.kinds[st.k];
  document.getElementById('ctitle').textContent = title; document.title = title + ' — Breslev Gang · Prévisualisation';
  document.getElementById('ckick').textContent = 'Collection · relevé public 29/10/2026';
  document.getElementById('cintro').textContent = INTRO[st.k] || '';
  var base = D.products.filter(function (p) { return st.k === 'Tout' || p.k === st.k; });
  var fams = {}; base.forEach(function (p) { fams[p.f] = (fams[p.f] || 0) + 1; });
  var famList = Object.keys(fams).sort(function (a, b) { return fams[b] - fams[a]; });
  var PR = [['', 'Tous prix'], ['lo', '≤ 90 €'], ['mid', '90 – 150 €'], ['hi', '> 150 €']];
  function chip(label, on, fn) { var b = document.createElement('button'); b.type = 'button'; b.className = 'bg-chip'; b.textContent = label; b.setAttribute('aria-pressed', on); b.onclick = function () { fn(); st.n = 24; draw(); }; return b; }
  function draw() {
    var f = document.getElementById('filters'); f.innerHTML = '';
    if (famList.length > 1) famList.forEach(function (x) { f.appendChild(chip(x + ' · ' + fams[x], st.f === x, function () { st.f = st.f === x ? '' : x; })); });
    PR.slice(1).forEach(function (x) { f.appendChild(chip(x[1], st.price === x[0], function () { st.price = st.price === x[0] ? '' : x[0]; })); });
    f.appendChild(chip('En stock', st.avail, function () { st.avail = !st.avail; }));
    var l = base.filter(function (p) {
      return (!st.f || p.f === st.f) && BG.matches(p, st.q) && (!st.avail || p.a) &&
        (!st.price || (st.price === 'lo' ? p.p <= 9000 : st.price === 'mid' ? p.p > 9000 && p.p <= 15000 : p.p > 15000));
    });
    if (st.grp) { var seen = {}; l = l.filter(function (p) { if (!p.g) return true; if (seen[p.g]) return false; seen[p.g] = 1; return true; }); }
    if (st.sort === 'pa') l.sort(function (a, b) { return a.p - b.p; });
    if (st.sort === 'pd') l.sort(function (a, b) { return b.p - a.p; });
    if (st.sort === 'az') l.sort(function (a, b) { return a.t.localeCompare(b.t); });
    document.getElementById('grid').innerHTML = l.slice(0, st.n).map(function (p, i) { return P.card(p, { grouped: st.grp, eager: i < 4 }); }).join('');
    document.getElementById('count').textContent = l.length + (st.grp ? ' modèles' : ' pièces');
    document.getElementById('empty').hidden = l.length > 0;
    document.getElementById('more').hidden = l.length <= st.n;
  }
  document.getElementById('sort').onchange = function (e) { st.sort = e.target.value; draw(); };
  document.getElementById('grp').onchange = function (e) { st.grp = e.target.checked; draw(); };
  document.getElementById('more').onclick = function () { st.n += 24; draw(); };
  document.getElementById('reset').onclick = function () { st.f = st.q = st.price = st.sort = ''; st.avail = false; document.getElementById('sort').value = ''; draw(); };
  draw();
})();
</script></body></html>
